<meta name="theme-color" content="#070b11">

{% if page.is_home %}
<title>Precious Oluwafemi Sani — AI Security Engineer | LLM Red-Teaming | AI Safety & Governance</title>

<!-- Open Graph / Social -->
<meta property="og:title" content="Precious Oluwafemi Sani — AI Security Engineer">
<meta property="og:description" content="AI Security Engineer and researcher with 5+ years across applied ML, AI safety, enterprise governance, and community leadership.">

<meta property="og:type" content="website">

    "https://linkedin.com/in/pfemisani",

{% else %}
{% seo %}
{% endif %}
{% feed_meta %}

<!-- Apply saved theme before paint -->
<script>
    try {
        var savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light' || savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', savedTheme);
        }
    } catch (e) {}
</script>
