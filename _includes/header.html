{%- if page.is_home -%}{%- assign home = '' -%}{%- else -%}{%- assign home = '/' | relative_url -%}{%- endif -%}
<header class="site-header">
    <nav class="nav-container" aria-label="Primary">
        <div class="logo">
            <a href="{{ home }}#hero" aria-label="Home"><span class="prompt">~/</span>pos<span class="cursor" aria-hidden="true"></span></a>
        </div>
        <ul class="nav-links" id="nav-links">
            <li><a href="{{ home }}#about">about</a></li>
            <li><a href="{{ home }}#focus">focus</a></li>
            <li><a href="{{ home }}#work">work</a></li>
            <li><a href="{{ '/blog/' | relative_url }}"{% if page.is_blog or page.layout == 'post' %} class="active" aria-current="page"{% endif %}>blog</a></li>
            <li><a href="{{ home }}#speaking">speaking</a></li>
            <li><a href="{{ home }}#community">community</a></li>
            <li><a href="{{ home }}#contact">contact</a></li>
            <li><a href="{{ home }}#hackthebot" class="nav-cta" data-bot-link>./hack_the_bot</a></li>
        </ul>
        <div class="nav-actions">
            <button class="cmdk-trigger" type="button" data-cmdk-open aria-label="Open command menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <span class="cmdk-trigger-label">search</span>
                <kbd data-mod-key>⌘K</kbd>
            </button>
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle light and dark theme">
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
            <button class="hamburger" id="hamburger" type="button" aria-label="Toggle navigation" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>
</header>
